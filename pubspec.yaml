name: sangh_ledger
description: "Offline-first community/Sangh financial ledger application."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.13.7

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  cupertino_icons: ^1.0.8

  # State Management
  flutter_riverpod: ^2.5.1

  # Encrypted Database & Key Storage
  sqflite_sqlcipher: ^3.1.0+1
  flutter_secure_storage: ^11.2.0

  # Authentication & Cryptography
  local_auth: ^2.2.0
  cryptography: ^2.7.2

  # PDF & Printing
  pdf: ^3.11.1
  printing: ^5.13.2

  # File handling, archiving, compression
  archive: ^3.6.1
  file_picker: ^13.3.3
  image: ^4.2.0

  # Localization, Formatting, Timezone, Utils
  intl: ^0.20.2
  uuid: ^4.4.0
  path_provider: ^2.1.3
  path: ^1.9.0
  timezone: ^0.9.4

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  generate: true
  uses-material-design: true

  assets:
    - assets/fonts/

  fonts:
    - family: NotoSansKannada
      fonts:
        - asset: assets/fonts/NotoSansKannada-Regular.ttf
